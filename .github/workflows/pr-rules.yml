name: PR rules

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [develop, production]

permissions:
  pull-requests: read

jobs:
  pr-rules:
    name: pr-rules
    runs-on: ubuntu-latest
    steps:
      # O título vira a mensagem do commit no squash: tipo(escopo): assunto
      - name: Título no formato tipo(escopo) assunto
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            perf
            test
            docs
            build
            ci
            chore
            style
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: O assunto "{subject}" deve começar com letra minúscula.

      # production só recebe release (develop) ou correção urgente (hotfix/*).
      - name: Origem permitida para production
        if: github.base_ref == 'production'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            develop|hotfix/*) echo "Origem '$HEAD_REF' permitida." ;;
            *) echo "::error::PR para production deve sair de develop ou hotfix/*, não de '$HEAD_REF'."; exit 1 ;;
          esac
