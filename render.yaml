services:
  - type: web
    name: app-gym
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: APP_USER_EMAIL
        sync: false
      - key: APP_USER_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: app-gym-db
          property: connectionString

databases:
  - name: app-gym-db
    plan: free
    postgresMajorVersion: "16"
